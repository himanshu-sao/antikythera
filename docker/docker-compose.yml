# Antikythera - Docker Compose (Development Mode)
#
# Prerequisites:
#   1. Create ~/.antikythera/.env with your credentials
#   2. Ensure ~/antikythera-data directory exists for persistent data
#
# Usage:
#   docker-compose up          # Start all services
#   docker-compose up -d       # Start in background
#   docker-compose logs -f     # Follow logs
#   docker-compose down        # Stop all services
#
# Services:
#   - backend:   FastAPI API server (container 8006, published 127.0.0.1:18006)
#   - frontend:  Vite dev server (container 5173, published 127.0.0.1:15173)
#
# Nothing is published off-loopback. Access from a laptop is an SSH tunnel; see docker/README.md.
#   - orchestrator: Background pipeline processor

services:
  # -------------------------------------------------------------------------
  # Backend API Server
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: himanshusao/antikythera:latest
    container_name: antikythera-backend
    restart: unless-stopped
    ports:
      # Loopback-only on the Docker host (D8); reach it from the laptop via an SSH tunnel.
      - "127.0.0.1:18006:8006"
    environment:
      # These are loaded from ~/.antikythera/.env by the entrypoint
      - HOME=/root
      - ANTIKYTHERA_HOME=/root/.antikythera
    volumes:
      # Read-write on purpose (P0-9): the AI Engine settings (set default model, set API
      # key) persist ai_config.json and .ai_env into this directory. A :ro mount made
      # set-default fail with a 500 and set-key silently not persist. Keep the host
      # directory private (chmod 700).
      - ~/.antikythera:/root/.antikythera
      # Mount data directory for persistent state
      - ~/antikythera-data:/app/automation-ideas
      # Optional: mount logs directory
      - ./logs:/app/logs
    networks:
      - antikythera-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on: []

  # -------------------------------------------------------------------------
  # Frontend UI Server (Vite Development)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    image: himanshusao/antikythera-ui:latest
    container_name: antikythera-frontend
    restart: unless-stopped
    ports:
      # Loopback-only on the Docker host (D8); reach it from the laptop via an SSH tunnel.
      - "127.0.0.1:15173:5173"
    environment:
      - VITE_API_URL=http://localhost:18006
      # Vite dev-server proxy target for /api (reached over the compose network).
      - API_PROXY_TARGET=http://backend:8006
      - HOME=/root
    volumes:
      # Stays read-only: the Vite dev server never writes settings. Only backend and
      # orchestrator need a read-write config mount (P0-9).
      - ~/.antikythera:/root/.antikythera:ro
    networks:
      - antikythera-network
    depends_on:
      backend:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Orchestrator - Background Pipeline Processor
  # -------------------------------------------------------------------------
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: himanshusao/antikythera:latest
    container_name: antikythera-orchestrator
    restart: unless-stopped
    command: --start-orchestrator
    environment:
      - HOME=/root
      - ANTIKYTHERA_HOME=/root/.antikythera
    volumes:
      # Read-write on purpose (P0-9): the AI Engine settings (set default model, set API
      # key) persist ai_config.json and .ai_env into this directory. A :ro mount made
      # set-default fail with a 500 and set-key silently not persist. Keep the host
      # directory private (chmod 700).
      - ~/.antikythera:/root/.antikythera
      # Mount data directory for persistent state
      - ~/antikythera-data:/app/automation-ideas
      # Mount logs directory
      - ./logs:/app/logs
    networks:
      - antikythera-network
    depends_on:
      backend:
        condition: service_healthy

# -------------------------------------------------------------------------
# Networks
# -------------------------------------------------------------------------
networks:
  antikythera-network:
    driver: bridge
    name: antikythera-network