[pytest]
testpaths = tests api/executors
asyncio_mode = auto
addopts = -m "not live_llm and not network and not watcher" --strict-markers
markers =
    live_llm: calls a real LLM provider (needs credentials and network); excluded by default
    network: needs real network access; excluded by default and exempt from the autouse network guard
    watcher: exercises real OS filesystem watching (timing-sensitive); excluded by default
filterwarnings = ignore::pytest.PytestReturnNotNoneWarning
